<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Student Field System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="navbar"></aside>
<div class="main-content">

<div class="form-box">
    <h2>📝 Register</h2>
    <form id="registerForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="07XXXXXXXX">

        <label for="password">Password</label>
        <div class="password-wrap">
            <input type="password" id="password" minlength="6" required>
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)" aria-label="Show password">👁</button>
        </div>

        <button type="submit" class="btn btn-block">Register</button>
        <p class="form-msg" id="formMsg"></p>
    </form>
    <p class="form-footer">Already have an account? <a href="login.html">Login here</a></p>
</div>

</div>
</div>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script>renderNavbar('register');</script>
</body>
</html>
