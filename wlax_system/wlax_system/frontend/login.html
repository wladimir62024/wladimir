<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Wladimir Field System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="navbar"></aside>
<div class="main-content">

<div class="form-box">
    <h2>🔐 Login</h2>
    <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <div class="password-wrap">
            <input type="password" id="password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)" aria-label="Show password">👁</button>
        </div>

        <button type="submit" class="btn btn-block">Login</button>
        <p class="form-msg" id="formMsg"></p>
    </form>
    <p class="form-footer">Don't have an account? <a href="register.html">Register here</a></p>
</div>

</div>
</div>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script>renderNavbar('login');</script>
</body>
</html>
