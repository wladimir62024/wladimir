<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Wladimir Field System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="navbar"></aside>
<div class="main-content">

<div class="form-box">
    <h2>👤 Profile</h2>

    <div class="profile-picture-box">
        <div id="picturePreviewBox"><div class="profile-picture-placeholder">👤</div></div>
        <form id="pictureForm" enctype="multipart/form-data" style="width:100%;">
            <input type="file" id="profile_picture_file" accept="image/png,image/jpeg,image/gif,image/webp">
            <button type="submit" class="btn btn-sm btn-block" style="margin-top:0.6rem;">📷 Upload Profile Picture</button>
            <p class="form-msg" id="pictureMsg"></p>
        </form>
    </div>

    <form id="profileForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" required>

        <label for="email">Email (cannot be changed)</label>
        <input type="email" id="email" disabled>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone">

        <label for="new_password">New Password (leave blank if you don't want to change it)</label>
        <div class="password-wrap">
            <input type="password" id="new_password" minlength="6">
            <button type="button" class="toggle-password" onclick="togglePassword('new_password', this)" aria-label="Show password">👁</button>
        </div>

        <button type="submit" class="btn btn-block">Save Changes</button>
        <p class="form-msg" id="formMsg"></p>
    </form>
</div>

</div>
</div>

<script src="js/common.js"></script>
<script src="js/profile.js"></script>
<script>renderNavbar('profile');</script>
</body>
</html>
